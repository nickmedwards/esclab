[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "esclab"
version = "0.0.7"
authors = [
  { name="Mike Wagner", email="mjwagner2@wisc.edu" },
]
description = "Energy Systems Simulation and Control Lab"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Education",
]
license = "LicenseRef-UW-Madison-proprietary-instructional"
license-files = ["LICENSE"]

dependencies = [
    "eeslib>=0.0.5",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "CoolProp>=6.4.0",
    "sympy>=1.13.0",
    "gurobipy>=12.0.1",
    "pandas>=1.3.0",
    "matplotlib>=3.10.0",
    "pyqtgraph>=0.14.0",
    "PyQt5>=5.15.11",
    "scikit-learn",
    "statsmodels",
]

[project.urls]
Homepage = "https://github.com/esclab/esclab"
Issues = "https://github.com/esclab/esclab/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=0.10",
    'twine>=4.0.0',
    "sphinx>=8.2.3",
    "sphinx_rtd_theme>=3.0.2",
    "sphinx_autodoc_typehints>=3.5.2", 
]
admin = [
]
